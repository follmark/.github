  @keyframes gone{from{opacity:1}to{opacity:0}}
  @keyframes dim{to{opacity:.14}}
  @keyframes fillin{from{fill-opacity:0}to{fill-opacity:1}}
  @keyframes wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes lockA{from{transform:translate(-150px,46px) rotate(15deg)}to{transform:none}}
  @keyframes lockB{from{transform:translate(150px,-54px) rotate(195deg)}to{transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.ink{opacity:0}.gd{opacity:.14}}
</style>
